# Plantopia's palette: light, sage and eucalyptus.
#
# Theme tokens rather than injected CSS. CSS aimed at Streamlit's internal class
# names breaks silently on upgrade and is invisible to anyone reading the app's
# source; these keys are the supported surface and are checked at startup.

[theme]
base = "light"

# Eucalyptus, for buttons, focus rings and the "primary" accents.
primaryColor = "#4A7C59"

# Not white. A green-tinted paper, with pale sage behind cards, the sidebar and
# expanders — enough separation to read as a surface without a grey box.
backgroundColor = "#F7FAF6"
secondaryBackgroundColor = "#E8F0E6"

# Deep green-charcoal rather than black: pure black on a tinted background reads
# as a mismatch, and this keeps well clear of the contrast floor.
textColor = "#1F2E23"
linkColor = "#3E6B4C"

borderColor = "#CFDCC9"
codeBackgroundColor = "#EEF4EC"
baseRadius = "medium"

# Charts default to Streamlit's blues, which would be the one cold thing on the
# page. The Evaluation page's per-category bars use the first of these.
chartCategoricalColors = ["#4A7C59", "#7FA98A", "#A8C3A0", "#5E8C7B", "#93B5A3"]

# The sidebar carries the navigation, so it takes the sage rather than the paper.
[theme.sidebar]
backgroundColor = "#E8F0E6"
secondaryBackgroundColor = "#DCE8D9"
borderColor = "#CFDCC9"

# Deliberately the same palette as above, not a dark counterpart. Streamlit reads
# this section when a viewer's system or menu asks for dark; without it, anything
# left unset would fall back to Streamlit's dark defaults and the app would come
# out half sage and half charcoal. Plantopia has no dark mode by choice, so the
# two themes are one theme.
[theme.dark]
primaryColor = "#4A7C59"
backgroundColor = "#F7FAF6"
secondaryBackgroundColor = "#E8F0E6"
textColor = "#1F2E23"
linkColor = "#3E6B4C"
borderColor = "#CFDCC9"
codeBackgroundColor = "#EEF4EC"
baseRadius = "medium"
# No chartCategoricalColors here: chart palettes are not a per-mode option, and the
# one set under [theme] above already applies in both.

[theme.dark.sidebar]
backgroundColor = "#E8F0E6"
secondaryBackgroundColor = "#DCE8D9"
borderColor = "#CFDCC9"
