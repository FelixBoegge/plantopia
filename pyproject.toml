[project]
name = "plantopia"
version = "0.1.0"
description = "An AI plant-health agent that diagnoses ailing plants from photos and a short symptom history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-frontmatter>=1.3.0",
    "sqlalchemy>=2.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "langgraph-api>=0.12.4",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "syrupy>=5.5.3",
    "time-machine>=3.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm' --strict-markers --cov --cov-fail-under=85"
markers = [
    "integration: real SQLite and Chroma, still no LLM or network",
    "llm: hits the real model, costs money, opt-in only",
]
filterwarnings = ["error::DeprecationWarning:plantopia.*"]

[tool.coverage.run]
source = ["core", "agent", "api", "identity", "tools", "data", "knowledge", "services", "eval"]
omit = [
    "*/__init__.py",
    # The evaluation CLI: argument parsing, real model construction and file writing.
    # There is nothing here to unit test that would not be a mock asserting on itself,
    # and counted in the denominator it only made the gate trip on unrelated changes.
    # Everything beneath it — case loading, the scripted model, scoring, stability,
    # report rendering — is unit-tested.
    "eval/run_eval.py",
    # One-shot migration tools, on the same precedent. Both talk to systems a test
    # must not: export_chroma reads the Chroma store that is being retired, and
    # capture_retrieval_fixtures calls the embedding API once to record the parity
    # baseline. Their output is checked by the thing that consumes it — the corpus
    # row counts, and the parity test itself — rather than by mocking the call.
    "knowledge/export_chroma.py",
    "eval/capture_retrieval_fixtures.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff format reformats fenced ```python blocks inside .md files by default, which
# would otherwise rewrite code samples embedded in docs/plans every time `ruff
# format .` runs at the repo root.
extend-exclude = [
    "*.md",
    # Alembic writes these. Reformatting a generated migration to satisfy the
    # linter means editing a file the generator will write differently next time,
    # for a file whose correctness is proved by `alembic upgrade` and `alembic
    # check` rather than by import order.
    "data/migrations/versions/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]
